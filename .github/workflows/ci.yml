name: Validate Cask

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Check out Tap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate AgentMeter Cask
        shell: bash
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: ./scripts/test_agentmeter_cask.sh
